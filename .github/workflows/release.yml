name: Build & Release KahamaticPRO

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build CEP UI and assemble dist-cep
        run: npm run build

      - name: Sync tag version into dist-cep/CSXS/manifest.xml
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const p = "dist-cep/CSXS/manifest.xml";
            const v = process.env.RELEASE_VERSION;
            let xml = fs.readFileSync(p, "utf8");
            xml = xml.replace(/ExtensionBundleVersion="[^"]+"/, `ExtensionBundleVersion="${v}"`);
            xml = xml.replace(/(<Extension Id="com\.kahamatic\.pro\.panel" Version=")[^"]+(")/, `$1${v}$2`);
            fs.writeFileSync(p, xml, "utf8");
          '

      - name: Compile native Apple Silicon Swift helper (zero dependencies)
        run: |
          mkdir -p dist-cep/bin release
          swiftc -O -target arm64-apple-macos13.0 native/KahamaticHelper.swift -o dist-cep/bin/kahamatic-helper
          chmod 755 dist-cep/bin/kahamatic-helper
          xattr -c dist-cep/bin/kahamatic-helper || true
          codesign --force --sign - dist-cep/bin/kahamatic-helper

      - name: Package self-update archive and manifest
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist-cep release/KahamaticPRO-update.zip
          printf '{"version":"%s","asset":"KahamaticPRO-update.zip"}\n' "$RELEASE_VERSION" > release/latest.json

      - name: Sign KahamaticPRO.zxp via Adobe ZXPSignCmd v4.1.3
        env:
          CEP_CERT_BASE64: ${{ secrets.CEP_CERT_BASE64 }}
          CEP_CERT_PASSWORD: ${{ secrets.CEP_CERT_PASSWORD }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/macOS/ZXPSignCmd" -o ./ZXPSignCmd
          chmod 755 ./ZXPSignCmd
          xattr -c ./ZXPSignCmd || true
          arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license || true

          if [ -n "${CEP_CERT_BASE64}" ] && [ -n "${CEP_CERT_PASSWORD}" ]; then
            echo "${CEP_CERT_BASE64}" | base64 --decode > cert.p12
            CERT_PASS="${CEP_CERT_PASSWORD}"
          else
            CERT_PASS="kahamatic_ci_temp_$(date +%s)"
            ./ZXPSignCmd -selfSignedCert BD Dhaka "Kahamatic" "KahamaticPRO" "$CERT_PASS" cert.p12
          fi

          ./ZXPSignCmd -sign dist-cep release/KahamaticPRO.zxp cert.p12 "$CERT_PASS" -tsa http://timestamp.digicert.com \
            || ./ZXPSignCmd -sign dist-cep release/KahamaticPRO.zxp cert.p12 "$CERT_PASS"
          rm -f cert.p12 ./ZXPSignCmd

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kahamatic-pro-${{ env.RELEASE_VERSION }}
          path: release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
